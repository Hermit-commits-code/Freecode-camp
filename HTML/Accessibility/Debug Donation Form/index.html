<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Donation Form</title>
  </head>

  <body>
    <h1>Donation Form</h1>
    <form>
      <label for="fullName">Full Name:</label>
      <input type="text" name="name" id="fullName" required>

      <label for="emailAddress"> Email Address:</label>
      <input type="email" name="email" id="emailAddress" required>

      <label for="donationAmt">Donation Amount ($):</label>
      <input type="number" name="amount" id="donationAmt" required>

      <label for="subscription">Subscribe</label>
      <input type="checkbox" name="newsletter" id="subscription">
      Subscribe

      <input type="submit" value="Send">
    </form>
  </body>

</html>
