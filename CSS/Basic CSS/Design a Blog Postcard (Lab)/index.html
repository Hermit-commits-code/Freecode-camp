<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Blog Postcard</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="blog-post-card">
      <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="" class="post-img">
      <div class="post-content">
        <h2 class="post-title">Post Title</h2>
        <p class="post-excerpt">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quidem neque maiores eos sequi
          reiciendis consequatur magnam reprehenderit laboriosam rerum assumenda, officia sit tempore voluptates
          molestias facere, vero, nemo unde ratione?</p>
        <a href="https://www.example.com/blog" class="read-more">Read More</a>
      </div>
    </div>
  </body>

</html>
