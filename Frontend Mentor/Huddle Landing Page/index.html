<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Frontend Mentor | Huddle Landing Page</title>
  </head>

  <body>
    <div class="container">
      <main class="card">
        <section class="card-top">
          <img src="images/logo.svg" alt="Huddle logo">
        </section>
        <section class="card-middle">
          <div class="left">
            <img src="images/illustration-mockups.svg" alt="Illustration Mockups">
          </div>
          <div class="right">
            <h2>Build The Community Your Fans Will Love</h2>
            <p>Huddle re-imagines the way we build communities. You have a voice, but so does your audience. Create
              connections with your users as you engage in genuine discussion</p>
            <button type="button">Register</button>
          </div>
        </section>
        <section class="card-bottom">
          <footer>
            <i class="fa-brands fa-facebook-f" aria-label="facebook"></i>
            <i class="fa-brands fa-twitter" aria-label="twitter"></i>
            <i class="fa-brands fa-instagram" aria-label="instagram"></i>
          </footer>
        </section>
      </main>
    </div>
  </body>

</html>
