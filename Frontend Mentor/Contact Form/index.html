<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main>
      <h1>Contact Us</h1>

      <div id="successMessage" role="status" aria-live="polite" aria-atomic="true"></div>

      <form id="contactForm" novalidate>
        <div>
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" required aria-describedby="firstNameError">
          <p id="firstNameError" class="error-message"></p>
        </div>

        <div>
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" required aria-describedby="lastNameError">
          <p id="lastNameError" class="error-message"></p>
        </div>

        <div>
          <label for="emailAddress">Email Address</label>
          <input type="email" id="emailAddress" name="emailAddress" required aria-describedby="emailError">
          <p id="emailError" class="error-message"></p>
        </div>

        <fieldset aria-describedby="queryTypeError">
          <legend>Query Type</legend>

          <div>
            <input type="radio" id="general" name="queryType" value="general" required>
            <label for="general">General Query</label>
          </div>

          <div>
            <input type="radio" id="support" name="queryType" value="support" required>
            <label for="support">Support Request</label>
          </div>

          <p id="queryTypeError" class="error-message"></p>
        </fieldset>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required aria-describedby="messageError"></textarea>
          <p id="messageError" class="error-message"></p>
        </div>

        <div>
          <input type="checkbox" id="consent" name="consent" required aria-describedby="consentError">
          <label for="consent">I consent to being contacted by the team</label>
          <p id="consentError" class="error-message"></p>
        </div>

        <button type="submit">Submit</button>
      </form>
    </main>

    <script src="script.js"></script>
  </body>

</html>
